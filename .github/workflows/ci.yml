name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: dbt build on fixture data
        env:
          F1_DATA_DIR: tests/fixtures/data
        run: |
          mkdir -p tests/fixtures/data/lake
          dbt build --project-dir transform --profiles-dir transform --target ci
      # Catches a broken Dockerfile before it reaches main.
      - name: Build the Docker image
        run: docker build .
