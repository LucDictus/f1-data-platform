[project]
    name = "f1-data-platform"
    version = "0.0.1"
    description = "My f1 data platform"
    authors = [{ name = "LucDictus", email = "lucdictus161@gmail.com" }]
    requires-python = ">=3.12"
    dependencies = ["requests", "duckdb", "dbt-duckdb"]

[project.optional-dependencies]
    dev = ["pytest", "ruff", "responses"]

[tool.ruff]
    line-length = 100
    src = ["src"]

[tool.pytest.ini_options]
    pythonpath = ["src"]