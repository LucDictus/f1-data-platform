[project]
    name = "f1-data-platform"
    version = "1.0.0"
    description = "End-to-end Formula 1 data platform: ingestion, dbt, Dagster and a Streamlit dashboard"
    authors = [{ name = "LucDictus", email = "lucdictus161@gmail.com" }]
    requires-python = ">=3.12"
    dependencies = ["requests", "duckdb", "dbt-duckdb>=1.11", "dagster", "dagster-dbt", "dbt-core>=1.12", "streamlit>=1.50", "dagster-webserver"]

[project.optional-dependencies]
    dev = ["pytest", "ruff", "responses"]

[tool.ruff]
    line-length = 100
    src = ["src"]

[tool.pytest.ini_options]
    pythonpath = ["src"]
