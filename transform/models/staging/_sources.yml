version: 2

# Raw JSON written by src/f1_pipeline/ingest/jolpica.py. Paths are relative to the repo root,
# because dbt runs from there (see README). season=* picks up every season on disk.
sources:
  - name: jolpica
    tables:
      - name: results
        meta:
          external_location: "{{ env_var('F1_DATA_DIR', 'data') }}/raw/results/season=*/data.json"
      - name: pitstops
        meta:
          external_location: "{{ env_var('F1_DATA_DIR', 'data') }}/raw/pitstops/season=*/round=*/data.json"
      - name: laps
        meta:
          external_location: "{{ env_var('F1_DATA_DIR', 'data') }}/raw/laps/season=*/round=*/data.json"
