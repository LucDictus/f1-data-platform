f1:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('F1_DATA_DIR', 'data') }}/f1.duckdb"
      external_root: "s3://f1-lake/staging"
      extensions: [ httpfs ]
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT', 'localhost:9000') }}"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_KEY') }}"
        s3_region: us-east-1
        s3_use_ssl: false
        s3_url_style: path
